name: Create build-base-zb-r23 image

on:
  workflow_dispatch:
    inputs:
      ncs_zb_version:
        description: Zigbee R23 add-on version to build (nrfconnect/ncs-zigbee tag, without the leading "v")
        required: true
        default: 1.4.0
      ncs_version:
        description: 'nRF Connect SDK version required by ncs_zb_version (default: inferred for known ncs_zb_version values)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-base-zb-r23:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve NCS version
        id: ncs
        env:
          NCS_ZB_VERSION: ${{ inputs.ncs_zb_version }}
          NCS_VERSION: ${{ inputs.ncs_version }}
        run: |
          if [ -z "$NCS_VERSION" ]; then
            case "$NCS_ZB_VERSION" in
              1.2.1) NCS_VERSION=v2.9.2 ;;
              1.3.0) NCS_VERSION=v2.9.2 ;;
              1.4.0) NCS_VERSION=v3.4.0 ;;
              *)
                echo "::error::No known nRF Connect SDK version for ncs-zigbee v${NCS_ZB_VERSION}. Pass ncs_version explicitly - check https://github.com/nrfconnect/ncs-zigbee/releases for the matching version." >&2
                exit 1
                ;;
            esac
          fi
          echo "value=${NCS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/build-base" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push build-base-zb-r23
        uses: docker/build-push-action@v7
        with:
          context: .
          target: build-base-zb-r23
          push: true
          build-args: |
            NCS_VERSION=${{ steps.ncs.outputs.value }}
            ZB_R23_VERSION=v${{ inputs.ncs_zb_version }}
          tags: |
            ${{ steps.image.outputs.name }}:zb-r23-${{ inputs.ncs_zb_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
