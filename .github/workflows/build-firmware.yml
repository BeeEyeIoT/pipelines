name: Build firmware

on:
  workflow_call:
    inputs:
      ncs_version:
        description: nRF Connect SDK version to use. Selects the build-base image tag pulled from GHCR.
        required: true
        type: string
      board:
        description: west build board target, e.g. weight_sensor/nrf54l15/cpuapp
        required: true
        type: string
      app_dir:
        description: Path to the application source, relative to the repo root
        required: false
        type: string
        default: .
      build_dir:
        description: Path to the west build output directory, relative to the repo root
        required: false
        type: string
        default: build
      board_root:
        description: Path to the root folder with custom board definitions, relative to the repo root
        required: false
        type: string
        default: .
      build_type:
        description: 'CMake build type. One of: Debug, Release, RelWithDebInfo, MinSizeRel.'
        required: false
        type: string
        default: MinSizeRel
      extra_west_args:
        description: Extra arguments appended to the west build invocation (after the CMake --)
        required: false
        type: string
        default: ''
      base_image:
        description: 'build-base image, without tag (default: ghcr.io/<org>/build-base)'
        required: false
        type: string
        default: ''
      artifact_name:
        description: Name of the workflow artifact that build output is uploaded as
        required: false
        type: string
        default: firmware
      artifact_paths:
        description: Newline-separated list of build output files/globs to publish as the artifact, relative to build_dir
        required: false
        type: string
        default: |          
          dfu_application.zip
    secrets:
      mcuboot_key_pem:
        description: MCUboot signing key (PEM), written to key.pem at the repo root before building
        required: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate build type
        id: build_type
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          case "$BUILD_TYPE" in
            Debug|Release|RelWithDebInfo|MinSizeRel) ;;
            *)
              echo "::warning::Invalid build_type '$BUILD_TYPE'. Must be one of: Debug, Release, RelWithDebInfo, MinSizeRel. Falling back to MinSizeRel."
              BUILD_TYPE=MinSizeRel
              ;;
          esac
          echo "value=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

      - name: Compute lowercase image name
        id: image
        run: |
          name="${{ inputs.base_image }}"
          if [ -z "$name" ]; then
            name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/build-base"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull build_base image
        run: |
          docker pull "${{ steps.image.outputs.name }}:${{ inputs.ncs_version }}"          

      - name: Write MCUboot signing key
        env:
          MCUBOOT_KEY_PEM: ${{ secrets.mcuboot_key_pem }}
        run: |
          if [ -n "$MCUBOOT_KEY_PEM" ]; then
            echo "$MCUBOOT_KEY_PEM" > key.pem
            chmod 600 key.pem
          fi


      - name: Build (west build via nrfutil toolchain)
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ inputs.ncs_version }}
          WORKSPACE: ${{ github.workspace }}
          BOARD: ${{ inputs.board }}
          APP_DIR: ${{ inputs.app_dir }}
          BUILD_DIR: ${{ inputs.build_dir }}
          BOARD_ROOT_INPUT: ${{ inputs.board_root }}
          BUILD_TYPE: ${{ steps.build_type.outputs.value }}
          EXTRA_WEST_ARGS: ${{ inputs.extra_west_args }}
        run: |          
          docker run --rm \
            -v "${WORKSPACE}:/workspace" \
            -w /workspace \
            -e BOARD -e APP_DIR -e BUILD_DIR -e BOARD_ROOT_INPUT -e BUILD_TYPE -e EXTRA_WEST_ARGS \
            "${IMAGE}" \
            bash -c ' \
              set -eux; \
              BOARD_ROOT_ABS=$(cd "/workspace/$BOARD_ROOT_INPUT" && pwd); \
              nrfutil sdk-manager toolchain launch \
                --ncs-version "$NCS_VERSION" \
                --install-dir "$NCS_INSTALL_DIR" \
                --chdir "$NCS_INSTALL_DIR/$NCS_VERSION" \
                -- west build -b "$BOARD" -s "/workspace/$APP_DIR" -d "/workspace/$BUILD_DIR" \
                -- -DBOARD_ROOT="$BOARD_ROOT_ABS" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" $EXTRA_WEST_ARGS \
            '

      - name: Remove signing key
        if: always()
        run: rm -f key.pem

      - name: Resolve artifact paths
        id: artifact_paths
        env:
          BUILD_DIR: ${{ inputs.build_dir }}
          ARTIFACT_PATHS: ${{ inputs.artifact_paths }}
        run: |
          {
            echo "paths<<PATHS_EOF"
            while IFS= read -r path; do
              [ -n "$path" ] && echo "${BUILD_DIR}/${path}"
            done <<< "$ARTIFACT_PATHS"
            echo "PATHS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ steps.artifact_paths.outputs.paths }}
          if-no-files-found: error
