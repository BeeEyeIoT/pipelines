name: Build firmware

on:
  workflow_call:
    inputs:
      ncs_version:
        description: nRF Connect SDK version to use. Selects the build-base image tag pulled from GHCR.
        required: true
        type: string
      board:
        description: Zephyr board target, e.g. weight_sensor/nrf54l15/cpuapp
        required: false
        type: string
        default: ''
      build_dir:
        description: Path to the CMake build output directory, relative to the repo root
        required: false
        type: string
        default: build
      board_root:
        description: Path to the root folder with custom board definitions, relative to the repo root
        required: false
        type: string
        default: ''
      build_type:
        description: 'CMake build type. One of: Debug, Release, RelWithDebInfo, MinSizeRel.'
        required: false
        type: string
        default: MinSizeRel
      extra_cmake_args:
        description: Extra arguments appended to the CMake configure invocation
        required: false
        type: string
        default: ''
      cmake_preset:
        description: Name of an existing preset in the repo's CMakePresets.json to build with, instead of generating a "release" preset
        required: false
        type: string
        default: ''
      use_sysbuild:
        description: Build using Zephyr sysbuild (multi-image) instead of a single CMake preset build. Incompatible with cmake_preset.
        required: false
        type: boolean
        default: false
      base_image:
        description: 'build-base image, without tag (default: ghcr.io/<org>/build-base)'
        required: false
        type: string
        default: ''
      artifact_name:
        description: Name of the workflow artifact that build output is uploaded as
        required: false
        type: string
        default: firmware
      artifact_paths:
        description: Newline-separated list of build output files/globs to publish as the artifact, relative to build_dir. Defaults to dfu_application.zip + merged.hex for sysbuild, or zephyr/zephyr.hex otherwise.
        required: false
        type: string
        default: ''
    secrets:
      mcuboot_key_pem:
        description: MCUboot signing key (PEM), written to key.pem at the repo root before building
        required: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        id: validate
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          USE_SYSBUILD: ${{ inputs.use_sysbuild }}
          CMAKE_PRESET: ${{ inputs.cmake_preset }}
          MCUBOOT_KEY_PEM: ${{ secrets.mcuboot_key_pem }}
        run: |
          case "$BUILD_TYPE" in
            Debug|Release|RelWithDebInfo|MinSizeRel) ;;
            *)
              echo "::warning::Invalid build_type '$BUILD_TYPE'. Must be one of: Debug, Release, RelWithDebInfo, MinSizeRel. Falling back to MinSizeRel."
              BUILD_TYPE=MinSizeRel
              ;;
          esac
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

          if [ "$USE_SYSBUILD" = "true" ] && [ -n "$CMAKE_PRESET" ]; then
            echo "::error::use_sysbuild is incompatible with cmake_preset. Unset cmake_preset when using sysbuild."
            exit 1
          fi

          if [ "$USE_SYSBUILD" = "true" ] && [ -z "$MCUBOOT_KEY_PEM" ]; then
            echo "::error::use_sysbuild requires the mcuboot_key_pem secret to be set."
            exit 1
          fi

      - name: Set defaults
        id: defaults
        env:
          ARTIFACT_PATHS: ${{ inputs.artifact_paths }}
          USE_SYSBUILD: ${{ inputs.use_sysbuild }}
        run: |
          if [ -n "$ARTIFACT_PATHS" ]; then
            paths="$ARTIFACT_PATHS"
          elif [ "$USE_SYSBUILD" = "true" ]; then
            paths="$(printf 'dfu_application.zip\nmerged.hex')"
          else
            paths="zephyr/zephyr.hex"
          fi
          {
            echo "artifact_paths<<PATHS_EOF"
            echo "$paths"
            echo "PATHS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compute lowercase image name
        id: image
        run: |
          name="${{ inputs.base_image }}"
          if [ -z "$name" ]; then
            name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/build-base"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull build_base image
        run: |
          docker pull "${{ steps.image.outputs.name }}:${{ inputs.ncs_version }}"          

      - name: Write MCUboot signing key
        if: inputs.use_sysbuild == 'true'
        env:
          MCUBOOT_KEY_PEM: ${{ secrets.mcuboot_key_pem }}
        run: |
          echo "$MCUBOOT_KEY_PEM" > key.pem
          chmod 600 key.pem

      - name: Validate CMake preset
        # Requires the checked-out CMakePresets.json, so it can't join the pre-checkout validation step.
        if: inputs.cmake_preset != ''
        env:
          PRESET: ${{ inputs.cmake_preset }}
        run: |
          jq -e --arg name "$PRESET" 'any(.configurePresets[]?; .name == $name)' CMakePresets.json \
            || { echo "::error::Preset '$PRESET' not found in CMakePresets.json"; exit 1; }

      - name: Write CMake preset
        if: inputs.cmake_preset == '' && inputs.use_sysbuild != 'true'
        env:
          BOARD: ${{ inputs.board }}
          BUILD_DIR: ${{ inputs.build_dir }}
          BOARD_ROOT_INPUT: ${{ inputs.board_root }}
          BUILD_TYPE: ${{ steps.validate.outputs.build_type }}
        run: |
          cat > CMakePresets.json <<EOF
          {
            "version": 2,
            "configurePresets": [
              {
                "name": "release",
                "generator": "Ninja",
                "binaryDir": "\${sourceDir}/${BUILD_DIR}",
                "cacheVariables": {
                  "BOARD": "${BOARD}",
                  "BOARD_ROOT": "\${sourceDir}/${BOARD_ROOT_INPUT}",
                  "CMAKE_BUILD_TYPE": "${BUILD_TYPE}"
                }
              }
            ]
          }
          EOF

      - name: Build
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ inputs.ncs_version }}
          WORKSPACE: ${{ github.workspace }}
          BUILD_DIR: ${{ inputs.build_dir }}
          EXTRA_CMAKE_ARGS: ${{ inputs.extra_cmake_args }}
          PRESET: ${{ inputs.cmake_preset != '' && inputs.cmake_preset || 'release' }}
          USE_SYSBUILD: ${{ inputs.use_sysbuild }}
          BOARD: ${{ inputs.board }}
          BOARD_ROOT_INPUT: ${{ inputs.board_root }}
          BUILD_TYPE: ${{ steps.validate.outputs.build_type }}
        run: |
          docker run --rm \
            -v "${WORKSPACE}:/workspace" \
            -w /workspace \
            -e BUILD_DIR -e EXTRA_CMAKE_ARGS -e PRESET -e USE_SYSBUILD -e BOARD -e BOARD_ROOT_INPUT -e BUILD_TYPE \
            "${IMAGE}" \
            bash -c ' \
              set -eux; \
              . /etc/profile.d/nrf-toolchain.sh; \
              if [ "$USE_SYSBUILD" = "true" ]; then \
                cmake -S "$ZEPHYR_BASE/share/sysbuild" \
                  -B "$BUILD_DIR" \
                  -DAPP_DIR="$PWD" \
                  -DBOARD="$BOARD" \
                  -DBOARD_ROOT="$PWD/$BOARD_ROOT_INPUT" \
                  -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
                  $EXTRA_CMAKE_ARGS; \
              else \
                cmake --preset "$PRESET" $EXTRA_CMAKE_ARGS; \
              fi; \
              cmake --build "/workspace/$BUILD_DIR" \
            '

      - name: Remove signing key
        if: always()
        run: rm -f key.pem

      - name: Resolve artifact paths
        id: artifact_paths
        env:
          BUILD_DIR: ${{ inputs.build_dir }}
          ARTIFACT_PATHS: ${{ steps.defaults.outputs.artifact_paths }}
        run: |
          {
            echo "paths<<PATHS_EOF"
            while IFS= read -r path; do
              [ -n "$path" ] && echo "${BUILD_DIR}/${path}"
            done <<< "$ARTIFACT_PATHS"
            echo "PATHS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ steps.artifact_paths.outputs.paths }}
          if-no-files-found: error
