name: Create build-base image

on:
  workflow_dispatch:
    inputs:
      ncs_version:
        description: nRF Connect SDK version to build (used as the image tag)
        required: true
        default: v3.1.1

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/build-base" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push build-base
        uses: docker/build-push-action@v7
        with:
          context: .
          target: build-base
          push: true
          build-args: |
            NCS_VERSION=${{ inputs.ncs_version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.ncs_version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
